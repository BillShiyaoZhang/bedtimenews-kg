name: Sync Bedtime News archive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [archive-updated]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: kg-main-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with archive
        uses: actions/checkout@v6
        with:
          ref: main
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Advance archive submodule
        run: |
          git -C sources/bedtimenews-archive-contents fetch origin main
          git -C sources/bedtimenews-archive-contents checkout --detach origin/main

      - name: Append safe archive additions
        run: npm run kg:update

      - name: Validate ontology and generated knowledge graph
        run: |
          npm run kg:validate
          npm run test:required

      - name: Check semantic coverage (advisory)
        id: coverage
        continue-on-error: true
        run: npm run test:coverage

      - name: Report semantic coverage warning
        if: steps.coverage.outcome == 'failure'
        run: |
          echo "::warning title=Semantic coverage below threshold::Coverage is advisory and did not block the archive sync. Review the coverage test output above."
          echo "### ⚠️ Semantic coverage is below the reviewed threshold" >> "$GITHUB_STEP_SUMMARY"
          echo "The archive sync will continue because coverage is an advisory quality signal." >> "$GITHUB_STEP_SUMMARY"

      - name: Notify repository owner through GitHub
        if: steps.coverage.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/notify-coverage.sh

      - name: Build GitHub Pages artifact
        run: npm run build:pages

      - name: Commit and push validated archive sync
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            sources/bedtimenews-archive-contents \
            data/archive-state.json \
            data/extraction-rules.json \
            data/news-overrides.json \
            data/ontology.json \
            data/processed/news.json \
            data/generated/kg.json \
            data/review/upstream-changes.json \
            data/review/news-segmentation.json \
            data/review/ontology-candidates.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "data: sync Bedtime News archive"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made by GITHUB_TOKEN do not start workflows triggered by `push`,
      # so explicitly dispatch the Pages workflow after a successful sync.
      - name: Deploy updated GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

  # A separate job can report failures even when checkout or npm never ran.
  # The daily Codex task also checks failed runs directly if reporting cannot run.
  notify-sync-failure:
    needs: sync
    if: always() && needs.sync.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open or refresh archive sync failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const repo = context.repo;
            const label = "sync-failure";
            const title = "Bedtime News archive sync failed";
            const runUrl = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...repo,
              run_id: context.runId,
              filter: "latest",
              per_page: 100,
            });
            const failedSteps = jobs
              .filter((job) => ["failure", "timed_out"].includes(job.conclusion))
              .flatMap((job) => {
                const steps = (job.steps ?? []).filter((step) =>
                  ["failure", "timed_out"].includes(step.conclusion),
                );
                return steps.length
                  ? steps.map((step) => `- ${job.name}: ${step.name} (${step.conclusion})`)
                  : [`- ${job.name}: ${job.conclusion}; step details unavailable`];
              });
            const start = "<!-- sync-failure-report:start -->";
            const end = "<!-- sync-failure-report:end -->";
            const report = [
              start,
              `Latest failed run: [${context.workflow} #${context.runNumber}, attempt ${process.env.GITHUB_RUN_ATTEMPT}](${runUrl})`,
              `Workflow SHA: \`${context.sha}\``,
              "",
              "Failed steps:",
              ...(failedSteps.length ? failedSteps : ["- Sync failed before step details were available; inspect the run logs."]),
              end,
            ].join("\n");
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...repo,
              state: "open",
              labels: label,
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              const previous = existing.body ?? "";
              const startIndex = previous.indexOf(start);
              const endIndex = previous.indexOf(end, startIndex);
              const body = startIndex >= 0 && endIndex >= startIndex
                ? previous.slice(0, startIndex) + report + previous.slice(endIndex + end.length)
                : `${previous}\n\n${report}`;
              if (body !== previous) {
                await github.rest.issues.update({ ...repo, issue_number: existing.number, body });
              }
              core.info(`Reused sync failure issue #${existing.number}; no repeat comment sent.`);
            } else {
              try {
                await github.rest.issues.getLabel({ ...repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  ...repo,
                  name: label,
                  color: "D73A4A",
                  description: "Archive sync failed before completion",
                });
              }
              const { data: issue } = await github.rest.issues.create({
                ...repo,
                title,
                labels: [label],
                body: "Archive synchronization failed. The daily Codex scheduled task should inspect the run logs and repair the cause before closing this issue.\n\n" + report,
              });
              core.info(`Opened sync failure issue #${issue.number}.`);
            }
