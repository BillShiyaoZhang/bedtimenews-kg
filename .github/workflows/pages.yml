name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected main commit (set by archive sync; leave blank for manual runs)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A raced/stale dispatch must fail without cancelling a valid newer deployment.
  group: ${{ inputs.expected_sha && inputs.expected_sha != github.sha && format('pages-stale-{0}', github.run_id) || 'pages' }}
  # Old reruns must not cancel a newer active deployment before being rejected.
  cancel-in-progress: false

env:
  TZ: UTC
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Verify requested deployment commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          if [[ -n "$EXPECTED_SHA" && "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::main changed before Pages dispatch. Run archive sync again to reconcile the current commit."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Acquire sources only for legacy validation
        shell: bash
        run: |
          if [[ ! -f data/accepted-release.json ]]; then
            git submodule update --init --recursive
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate knowledge graph
        run: npm run kg:release:validate

      - name: Build static site
        run: npm run build:pages
        env:
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Refuse superseded deployment
        uses: actions/github-script@v9
        with:
          script: |
            const { data: ref } = await github.rest.git.getRef({
              ...context.repo, ref: "heads/main",
            });
            if (context.ref !== "refs/heads/main" || ref.object?.sha !== context.sha) {
              throw new Error("This Pages run is no longer current main; refusing to deploy an older or non-main commit.");
            }

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
