name: Triage semantic coverage advisory

on:
  issues:
    types: [opened, labeled, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open coverage-advisory issue to triage
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: coverage-advisory-triage
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'coverage-advisory')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with archive
        uses: actions/checkout@v6
        with:
          ref: main
          submodules: recursive

      - name: Verify advisory issue
        id: gate
        uses: actions/github-script@v7
        env:
          REQUESTED_ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const issueNumber = Number(process.env.REQUESTED_ISSUE);
            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed("issue_number must be a positive integer");
              return;
            }
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const labels = issue.labels.map((label) =>
              typeof label === "string" ? label : label.name
            );
            const runnable =
              issue.state === "open" && labels.includes("coverage-advisory");
            core.setOutput("issue_number", String(issueNumber));
            core.setOutput("run", String(runnable));
            if (!runnable) {
              core.notice(
                `Issue #${issueNumber} is not an open coverage-advisory; nothing to do.`
              );
            }

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Confirm the advisory still reproduces
        if: steps.gate.outputs.run == 'true'
        id: coverage
        continue-on-error: true
        run: npm run test:coverage

      - name: Queue semantic remediation
        if: >-
          steps.gate.outputs.run == 'true' &&
          steps.coverage.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = "<!-- daily-ontology-kg-remediation -->";
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const { data: comments } =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              });
            if (!comments.some((comment) => comment.body?.includes(marker))) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body:
                  `${marker}\n` +
                  "Coverage still fails on `main`. The daily ChatGPT scheduled " +
                  "task will perform the ontology/KG audit and guarded remediation. " +
                  "This issue remains open until every validation gate passes.",
              });
            }

      - name: Validate recovered coverage
        if: >-
          steps.gate.outputs.run == 'true' &&
          steps.coverage.outcome == 'success'
        run: |
          npm run kg:validate
          npm run test:coverage
          npm run lint

      - name: Close recovered advisory
        if: >-
          steps.gate.outputs.run == 'true' &&
          steps.coverage.outcome == 'success'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body:
                "Coverage already passes on `main`; KG validation, the exact " +
                "100% coverage gate, and lint all passed. Closing this advisory.",
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: "closed",
              state_reason: "completed",
            });
